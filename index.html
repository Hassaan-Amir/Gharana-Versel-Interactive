<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Finance Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
    .container { max-width: 800px; margin: 20px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input, select, button { padding: 10px; margin: 5px 0; width: 100%; border-radius: 5px; border: 1px solid #ccc; }
    button { background: #007bff; color: white; cursor: pointer; }
    button:hover { background: #0056b3; }
    .nav { display: flex; justify-content: space-around; margin-bottom: 20px; }
    .nav button { flex: 1; margin: 5px; }
    .hidden { display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
    .income { color: green; }
    .expense { color: red; }
    .balance { font-size: 1.5em; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Auth Section -->
    <div id="auth-screen">
      <h2>Login / Register</h2>
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password" />
      <button onclick="login()">Login</button>
      <button onclick="register()">Register</button>
      <p id="auth-message"></p>
    </div>

    <!-- Main App -->
    <div id="app-screen" class="hidden">
      <div class="nav">
        <button onclick="showSection('dashboard')">Dashboard</button>
        <button onclick="showSection('add')">Add Transaction</button>
        <button onclick="logout()">Logout</button>
      </div>

      <!-- Dashboard -->
      <div id="dashboard" class="section">
        <h2>Welcome, <span id="user-email"></span></h2>
        <p class="balance">Total Balance: <span id="balance">0</span> PKR</p>
        <table>
          <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th></tr></thead>
          <tbody id="transaction-list"></tbody>
        </table>
      </div>

      <!-- Add Transaction -->
      <div id="add" class="section hidden">
        <h2>Add New Transaction</h2>
        <input type="text" id="desc" placeholder="Description" />
        <select id="type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
        <input type="number" id="amount" placeholder="Amount" />
        <select id="category">
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Rent">Rent</option>
          <option value="Salary">Salary</option>
          <option value="Shopping">Shopping</option>
          <option value="Other">Other</option>
        </select>
        <button onclick="addTransaction()">Save Transaction</button>
        <button onclick="startVoiceInput()">🎤 Voice Input</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== SUPABASE CONFIG ====================
    const supabaseUrl = 'https://YOUR-PROJECT.supabase.co';   // ← Change this
    const supabaseAnonKey = 'YOUR-ANON-KEY';                 // ← Change this

    const supabase = Supabase.createClient(supabaseUrl, supabaseAnonKey);

    let currentUser = null;

    // ==================== AUTH FUNCTIONS ====================
    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        currentUser = session.user;
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-email').textContent = currentUser.email;
        loadTransactions();
      }
    }

    async function register() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabase.auth.signUp({ email, password });
      document.getElementById('auth-message').textContent = error ? error.message : "Check your email to confirm!";
    }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById('auth-message').textContent = error.message;
      } else {
        currentUser = data.user;
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-email').textContent = currentUser.email;
        loadTransactions();
      }
    }

    async function logout() {
      await supabase.auth.signOut();
      location.reload();
    }

    // ==================== TRANSACTION FUNCTIONS ====================
    async function addTransaction() {
      const description = document.getElementById('desc').value;
      const type = document.getElementById('type').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const category = document.getElementById('category').value;

      if (!description || !amount) return alert("Description and Amount are required!");

      const { error } = await supabase
        .from('transactions')
        .insert({
          user_id: currentUser.id,
          description,
          type,
          amount: type === 'expense' ? -amount : amount,
          category,
          date: new Date().toISOString().split('T')[0]
        });

      if (error) alert(error.message);
      else {
        alert("Transaction added!");
        clearForm();
        loadTransactions();
      }
    }

    async function loadTransactions() {
      const { data, error } = await supabase
        .from('transactions')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('date', { ascending: false });

      if (error) return console.error(error);

      const tbody = document.getElementById('transaction-list');
      tbody.innerHTML = '';
      let balance = 0;

      data.forEach(t => {
        balance += t.amount;
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${t.date}</td>
          <td>${t.description}</td>
          <td>${t.category}</td>
          <td class="${t.amount > 0 ? 'income' : 'expense'}">${t.amount > 0 ? '+' : ''}${t.amount} PKR</td>
        `;
        tbody.appendChild(row);
      });

      document.getElementById('balance').textContent = balance.toFixed(0);
    }

    function clearForm() {
      document.getElementById('desc').value = '';
      document.getElementById('amount').value = '';
    }

    function showSection(section) {
      document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
      document.getElementById(section).classList.remove('hidden');
    }

    // ==================== VOICE INPUT (Preserved) ====================
    let recognition;
    function startVoiceInput() {
      if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
        return alert("Voice input not supported in this browser.");
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.toLowerCase();
        document.getElementById('desc').value = transcript;
        alert("Voice captured: " + transcript);
      };

      recognition.onerror = (e) => alert("Voice error: " + e.error);
      recognition.start();
    }

    // Initialize
    window.onload = () => {
      checkAuth();
    };
  </script>
</body>
</html>
