<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Finance Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
    .container { max-width: 800px; margin: 20px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input, select, button { padding: 12px; margin: 8px 0; width: 100%; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; }
    button { background: #007bff; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    .nav { display: flex; justify-content: space-around; margin: 15px 0; }
    .nav button { flex: 1; margin: 5px; }
    .hidden { display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
    .income { color: green; font-weight: bold; }
    .expense { color: red; font-weight: bold; }
    .balance { font-size: 1.6em; font-weight: bold; color: #333; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Auth Screen -->
    <div id="auth-screen">
      <h2>Family Finance Tracker</h2>
      <input type="email" id="email" placeholder="Enter Email" />
      <input type="password" id="password" placeholder="Enter Password" />
      <button id="login-btn">Login</button>
      <button id="register-btn">Register</button>
      <p id="auth-message" style="margin-top: 10px; font-weight: bold;"></p>
    </div>

    <!-- Main App -->
    <div id="app-screen" class="hidden">
      <div class="nav">
        <button id="dashboard-btn">Dashboard</button>
        <button id="add-btn">Add Transaction</button>
        <button id="logout-btn">Logout</button>
      </div>

      <div id="dashboard" class="section">
        <h2>Welcome, <span id="user-email"></span></h2>
        <p class="balance">Total Balance: <span id="balance">0</span> PKR</p>
        <table>
          <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th></tr></thead>
          <tbody id="transaction-list"></tbody>
        </table>
      </div>

      <div id="add" class="section hidden">
        <h2>Add New Transaction</h2>
        <input type="text" id="desc" placeholder="Description" />
        <select id="type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
        <input type="number" id="amount" placeholder="Amount in PKR" />
        <select id="category">
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Rent">Rent</option>
          <option value="Salary">Salary</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Other">Other</option>
        </select>
        <button id="save-btn">Save Transaction</button>
        <button id="voice-btn">🎤 Voice Input</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== SUPABASE CONFIG ====================
    const supabaseUrl = 'https://YOUR-PROJECT.supabase.co';     // ← CHANGE THIS
    const supabaseAnonKey = 'sb_publishable_xxxxxxxxxxxxxxxx';  // ← CHANGE THIS (Publishable key)

    const supabase = Supabase.createClient(supabaseUrl, supabaseAnonKey);

    let currentUser = null;

    // ==================== AUTH FUNCTIONS ====================
    async function register() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('auth-message');

      if (!email || !password) {
        msg.style.color = "red";
        msg.textContent = "Email and Password are required!";
        return;
      }

      const { error } = await supabase.auth.signUp({ 
        email, 
        password,
        options: { emailRedirectTo: window.location.href }
      });

      if (error) {
        msg.style.color = "red";
        msg.textContent = error.message;
      } else {
        msg.style.color = "green";
        msg.textContent = "Registration successful! Please check your email to confirm.";
      }
    }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('auth-message');

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        msg.style.color = "red";
        msg.textContent = error.message;
      } else {
        currentUser = data.user;
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-email').textContent = currentUser.email;
        loadTransactions();
      }
    }

    async function logout() {
      await supabase.auth.signOut();
      location.reload();
    }

    // ==================== TRANSACTIONS ====================
    async function addTransaction() {
      const description = document.getElementById('desc').value;
      const type = document.getElementById('type').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const category = document.getElementById('category').value;

      if (!description || isNaN(amount)) {
        alert("Description and valid Amount are required!");
        return;
      }

      const { error } = await supabase.from('transactions').insert({
        user_id: currentUser.id,
        description,
        type,
        amount: type === 'expense' ? -amount : amount,
        category,
        date: new Date().toISOString().split('T')[0]
      });

      if (error) alert(error.message);
      else {
        alert("✅ Transaction Saved!");
        clearForm();
        loadTransactions();
        showSection('dashboard');
      }
    }

    async function loadTransactions() {
      const { data, error } = await supabase
        .from('transactions')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('date', { ascending: false });

      if (error) return console.error(error);

      let balance = 0;
      const tbody = document.getElementById('transaction-list');
      tbody.innerHTML = '';

      data.forEach(t => {
        balance += t.amount;
        const row = `<tr>
          <td>${t.date}</td>
          <td>${t.description}</td>
          <td>${t.category}</td>
          <td class="${t.amount > 0 ? 'income' : 'expense'}">${t.amount > 0 ? '+' : ''}${t.amount} PKR</td>
        </tr>`;
        tbody.innerHTML += row;
      });

      document.getElementById('balance').textContent = balance.toFixed(0);
    }

    function clearForm() {
      document.getElementById('desc').value = '';
      document.getElementById('amount').value = '';
    }

    function showSection(section) {
      document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
      document.getElementById(section).classList.remove('hidden');
    }

    // Voice Input
    function startVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert("Voice input not supported in this browser");
      
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.onresult = (e) => {
        document.getElementById('desc').value = e.results[0][0].transcript;
      };
      recognition.start();
    }

    // Button Events
    document.getElementById('register-btn').addEventListener('click', register);
    document.getElementById('login-btn').addEventListener('click', login);
    document.getElementById('save-btn').addEventListener('click', addTransaction);
    document.getElementById('voice-btn').addEventListener('click', startVoiceInput);
    document.getElementById('dashboard-btn').addEventListener('click', () => showSection('dashboard'));
    document.getElementById('add-btn').addEventListener('click', () => showSection('add'));
    document.getElementById('logout-btn').addEventListener('click', logout);

    // Initialize
    window.onload = () => {
      supabase.auth.getSession().then(({ data }) => {
        if (data.session) {
          currentUser = data.session.user;
          document.getElementById('auth-screen').classList.add('hidden');
          document.getElementById('app-screen').classList.remove('hidden');
          document.getElementById('user-email').textContent = currentUser.email;
          loadTransactions();
        }
      });
    };
  </script>
</body>
</html>
